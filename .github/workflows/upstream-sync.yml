name: Upstream Sync
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [scan, canary, retry]
        default: scan
        description: 正式版本检查、接入金丝雀或第二轮修复
permissions:
  contents: read
concurrency:
  group: upstream-sync-controller
  cancel-in-progress: false
jobs:
  controller:
    if: github.repository_id == '1441172085' && (github.event_name == 'workflow_dispatch' || vars.UPSTREAM_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch pinned controller without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Controller regression tests
        run: node --test .github/upstream/controller.test.mjs
      - name: Discover and request Codex Cloud
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          SYNC_OWNER: glyahh
          SYNC_MODE: ${{ inputs.mode || 'scan' }}
          SYNC_EXECUTOR: ${{ vars.UPSTREAM_SYNC_EXECUTOR || 'codex-cloud-native' }}
        run: node scripts/upstream-sync.mjs
